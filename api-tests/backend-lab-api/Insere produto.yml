info:
  name: Insere produto
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/produto'
  body:
    type: json
    data: |-
      {
        "nome": "cerveja",
        "preco": 10,
        "quantidade": 2
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const body = req.getBody();
        body.detalhe = bru.getEnvVar("detalhe");
        req.setBody(body);
    - type: after-response
      code: |-
        const id = res.body.id;
        if (id) {
            bru.setEnvVar("id-produto", id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
