info:
  name: Atualiza produto
  type: http
  seq: 1

http:
  method: PUT
  url: '{{baseUrl}}/produto/{{id-produto}}'
  body:
    type: json
    data: |-
      {
        "nome": "Queijo brie",
        "preco": 39.90,
        "quantidade": 10
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const body = req.getBody();
        body.detalhe = bru.getEnvVar("detalhe");
        req.setBody(body);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
