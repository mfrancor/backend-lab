info:
  name: Atualiza produto
  type: http
  seq: 1

http:
  method: PUT
  url: '{{baseUrl}}/produto/{{id-produto}}'
  body:
    type: json
    data: |-
      {
        "nome": "Queijo",
        "preco": 39.90,
        "quantidade": 10,
        "detalhe": "node-express"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
