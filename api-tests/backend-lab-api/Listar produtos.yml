info:
  name: Listar produtos
  type: http
  seq: 1

http:
  method: GET
  url: '{{baseUrl}}/produtos'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (Array.isArray(res.body) && res.body.length > 0) {
          const id = res.body[0].id;
          bru.setEnvVar("id-produto", id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
